version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: codeforge-db
    environment:
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: codeforge_password
      POSTGRES_DB: codeforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeforge-network

  # Redis for Celery broker and caching
  redis:
    image: redis:7-alpine
    container_name: codeforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeforge-network

  # Main FastAPI Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codeforge-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codeforge:codeforge_password@db:5432/codeforge
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codeforge-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codeforge-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codeforge:codeforge_password@db:5432/codeforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codeforge-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Beat (scheduled tasks)
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codeforge-beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codeforge:codeforge_password@db:5432/codeforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codeforge-network

  # Flower for Celery monitoring (optional)
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codeforge-flower
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codeforge-network

volumes:
  postgres_data:

networks:
  codeforge-network:
    driver: bridge
