services:
  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./codeforge
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./codeforge/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Uncomment the volume below only if SANDBOX_ENABLED=True
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── Celery worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: ./codeforge
      dockerfile: Dockerfile
    env_file: ./codeforge/.env
    command: python -m celery -A app.celery_app worker --loglevel=info --concurrency=2 --pool=solo
    depends_on:
      - backend
    # Uncomment the volume below only if SANDBOX_ENABLED=True
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── React / Vite frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./codeforge-dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
